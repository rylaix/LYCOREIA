name: Build check

# Compiles every push and pull request (release + deeplog) so broken code is caught before a release.
# Pull requests from forks get no secrets, so the build is skipped for them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for reference libraries
        id: refs
        env:
          REFERENCE_LIBS_URL: ${{ secrets.REFERENCE_LIBS_URL }}
        run: |
          if [[ -z "$REFERENCE_LIBS_URL" ]]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::REFERENCE_LIBS_URL not available (fork PR or not configured); skipping build."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup .NET
        if: steps.refs.outputs.available == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Fetch reference libraries (private)
        if: steps.refs.outputs.available == 'true'
        env:
          REFERENCE_LIBS_URL: ${{ secrets.REFERENCE_LIBS_URL }}
          REFERENCE_LIBS_TOKEN: ${{ secrets.REFERENCE_LIBS_TOKEN }}
          REFERENCE_LIBS_SHA256: ${{ secrets.REFERENCE_LIBS_SHA256 }}
        run: |
          headers=(-H "Accept: application/octet-stream")
          [[ -n "$REFERENCE_LIBS_TOKEN" ]] && headers+=(-H "Authorization: Bearer $REFERENCE_LIBS_TOKEN")
          curl -fsSL "${headers[@]}" -o "$RUNNER_TEMP/reference-libs.zip" "$REFERENCE_LIBS_URL"
          if [[ -n "$REFERENCE_LIBS_SHA256" ]]; then
            echo "$REFERENCE_LIBS_SHA256  $RUNNER_TEMP/reference-libs.zip" | sha256sum -c -
          fi
          mkdir -p SR2MP/libraries
          unzip -q -o "$RUNNER_TEMP/reference-libs.zip" -d SR2MP/libraries

      - name: Build
        if: steps.refs.outputs.available == 'true'
        run: |
          dotnet restore SR2MP/SR2MP.csproj
          dotnet build SR2MP/SR2MP.csproj -c Release --no-restore -o out/release
          dotnet build SR2MP/SR2MP.csproj -c Release -p:DeepLog=true --no-restore -o out/deeplog
